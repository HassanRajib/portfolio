<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="card.css">
    <title>Terminal Card</title>
</head>
<body>
    <section class="terminal-card" aria-label="Interactive terminal card">
        <div class="terminal-header">
            <div class="buttons">
                <button class="btn close" type="button" aria-label="Close terminal" data-tooltip="Close"></button>
                <button class="btn minimize" type="button" aria-label="Minimize terminal" data-tooltip="Minimize"></button>
                <button class="btn maximize" type="button" aria-label="Maximize terminal" data-tooltip="Maximize"></button>
            </div>
            <div class="title">portfolio-terminal</div>
        </div>

        <div class="terminal-body">
            <div class="terminal-output" id="terminal-output" aria-live="polite"></div>

            <form class="terminal-input-bar" id="terminal-form" autocomplete="off">
                <label class="prompt" for="terminal-input">user@portfolio:~$</label>
                <input
                    id="terminal-input"
                    class="terminal-input"
                    type="text"
                    spellcheck="false"
                    placeholder="hi"
                    aria-label="Terminal input"
                >
            </form>
        </div>
    </section>

    <script src="card.js"></script>
</body>
</html>
